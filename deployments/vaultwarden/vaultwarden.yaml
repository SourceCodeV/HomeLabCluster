--- 

apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
  - {}
  # egress:
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: cnpg-system
  #     podSelector:
  #       matchLabels:
  #         app: postgresql
  #   ports:
  #     - protocol: TCP
  #       port: 5432

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-config
  namespace: vaultwarden

data:
  config.json: | 
    {
      "domain": "https://vaultwarden.local.tigovanroy.space",
      "sends_allowed": true,
      "disable_icon_download": true,
      "signups_allowed": true,
      "signups_verify": true,
      "signups_verify_resend_time": 3600,
      "signups_verify_resend_limit": 6,
      "invitations_allowed": false,
      "password_iterations": 100000,
      "show_password_hint": true,
      "ip_header": "X-Real-IP",
      "icon_cache_ttl": 0,
      "icon_cache_negttl": 0,
      "icon_download_timeout": 10,
      "icon_blacklist_non_global_ips": false,
      "disable_2fa_remember": false,
      "authenticator_disable_time_drift": false,
      "require_device_email": false,
      "reload_templates": false,
      "log_timestamp_format": "%Y-%m-%d %H:%M:%S.%3f",
      "disable_admin_token": false,
      "_enable_yubico": false,
      "_enable_duo": false,
      "_enable_smtp": false,
      "smtp_ssl": true,
      "smtp_explicit_tls": false,
      "smtp_port": 587,
      "smtp_from_name": "Vaultwarden",
      "smtp_timeout": 15,
      "smtp_accept_invalid_certs": false,
      "smtp_accept_invalid_hostnames": false,
      "_enable_email_2fa": false,
      "email_token_size": 6,
      "email_expiration_time": 600,
      "email_attempts_limit": 3
    }

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
  ports:
    - name: http
      port: 80
    - name: websocket
      port: 3012

--- 

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: vaultwarden-init
          image: vaultwarden/server:latest
          command:
            - cp
            - -f
            - /config/config.json
            - /data/config.json
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
            - name: vaultwarden-config
              mountPath: /config
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          imagePullPolicy: Always
          ports:  
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
          env:
            - name: ADMIN_TOKEN
              value: "$argon2id$v=19$m=65540,t=3,p=4$TW1XRXBrTHZEdVRvaDVXMUNzS0wzNXNSdnczVjh1UGdVa1RmTkFabmNWVT0$infp5IMm3jjlX3RQpG8GP5m70MQfk2KaTwny2oAuVO0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-secret
                  key: dbConnection
            - name: LOG_LEVEL
              value: info
            - name: EXTENDED_LOGGING
              value: "true"
            - name: WEBSOCKET_ENABLED
              value: "true"
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: vaultwarden-config
          configMap:
            name: vaultwarden-config
            items:
              - key: config.json
                path: config.json

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
    - match: Host(`vaultwarden.local.tigovanroy.space`) && Path(`/notifications/hub`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 3012
  tls:
    secretName: local-tigovanroy-space-production-tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-db-data
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-app-data
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce 
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-library-data
  namespace: romm
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: "" 
  volumeName: romm-media-pv
  resources:
    requests:
      storage: 3Ti
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-config
  namespace: homeassistant
  labels:
    app: zigbee2mqtt
data:
  configuration.yaml: |-
    # Let new devices join our zigbee network
    permit_join: true
    # Home Assistant integration (MQTT discovery)
    homeassistant: true
    # Docker-Compose makes the MQTT-Server available using "mqtt" hostname
    # MQTT server URL
    socat:
      enabled: false
      master: pty,raw,echo=0,link=/tmp/ttyZ2M,mode=777
      slave: tcp-listen:8485,keepalive,nodelay,reuseaddr,keepidle=1,keepintvl=1,keepcnt=5
      options: "-d -d"
      log: true
    mqtt:
      base_topic: zigbee2mqtt
      server: "mqtt://mosquitto.homeassistant"
    # Zigbee Adapter path
    serial:
      port: tcp://192.168.20.75:8888
    # Enable the Zigbee2MQTT frontend
    frontend:
      port: 8080
    # Let Zigbee2MQTT generate a new network key on first start
    advanced:
      network_key: [17, 35, 25, 178, 49, 211, 135, 158, 40, 2, 44, 36, 178, 181, 162, 143]
      #log_output: ["console"]
      log_level: debug
      log_output:
      - console
      - file

    ## Map devices to persistent /data directory
    devices: /data/devices.yaml
    groups: /data/groups.yaml
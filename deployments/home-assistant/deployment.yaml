---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homeassistant
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      volumes:
        - name: ha-storage
          persistentVolumeClaim:
            claimName: homeassistant-claim
        - name: ha-config
          configMap:
            name: home-assistant-config
      containers:
        - image: ghcr.io/home-assistant/home-assistant:stable
          name: home-assistant
          envFrom:
          - configMapRef:
              name: home-assistant-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - mountPath: "/config"
              name: ha-storage
            - mountPath: "/config/configuration.yaml"
              subPath: configuration.yaml
              name: ha-config
      hostNetwork: true


---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-tigovanroy-space
  namespace: default
spec:
  secretName: local-tigovanroy-space-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.local.tigovanroy.space"
  dnsNames:
  - "local.tigovanroy.space"
  - "*.local.tigovanroy.space"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "traefik,longhorn-system,monitoring,media,mealie,vaultwarden,adguard,cattle-system,actualbudget,node-feature-discovery, homeassistant"  # Control destination namespaces
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true" # Auto create reflection for matching namespaces
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "traefik,longhorn-system,monitoring,media,mealie,vaultwarden,adguard,cattle-system,actualbudget,node-feature-discovery,homeassistant" # Control auto-reflection namespaces

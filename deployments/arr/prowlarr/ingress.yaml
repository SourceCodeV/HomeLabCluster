apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr-ingress
  namespace: media
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.prowlarr.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: prowlarr-service
          port: 9696
    - match: Host(`prowlarr.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: prowlarr-service
          port: 9696
      middlewares:
        - name: prowlarr-headers
  tls:
    secretName: local-tigovanroy-space-production-tls

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.truenas.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: truenas-server
          port: 80  # Replace with the correct port if needed
          scheme: http  # Assuming HTTP; use https if Immich is using HTTPS
          passHostHeader: true
    - match: Host(`truenas.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: truenas-server
          port: 80  # Replace with the correct port if needed
          scheme: http
          passHostHeader: true
      middlewares:
        - name: default-headers
  tls:
    secretName: local-tigovanroy-space-production-tls  # Same TLS cert used for other services

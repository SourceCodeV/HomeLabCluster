
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: default
  labels:
    app: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Tigovanroy.space homepage

    background:
      image: https://cdnb.artstation.com/p/assets/images/images/006/897/659/large/mikael-gustafsson-wallpaper-mikael-gustafsson.jpg
      blur: sm # sm, md, xl... see https://tailwindcss.com/docs/backdrop-blur
      saturate: 100 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
      brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
      opacity: 100 # 0-100

    theme: dark
    color: slate
    useEqualHeights: true
    providers:
      openweathermap: "{{HOMEPAGE_VAR_OPENWEATHERMAP_API}}"
      weatherapi: "{{HOMEPAGE_VAR_WEATHERAPI_KEY}}"
      finnhub: "{{HOMEPAGE_VAR_FINNHUB_KEY}}"

    layout:
      Apps:
        header: true
        style: row
        columns: 3
      Calendar:
        useEqualHeights: true
        header: true
      Networking:
        header: true
      Cluster Monitoring:
        useEqualHeights: true
        style: row
        columns: 5
        header: true
      Downloading:
        header: true
        style: row
        columns: 3
      Links:
        header: true
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    - Cluster Monitoring:
        - Proxmox:
            icon: proxmox.svg
            href: "https://proxmox.local.tigovanroy.space"
            description: cluster
            widget:
                type: proxmox
                url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
                username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
                password: "{{HOMEPAGE_VAR_PROXMOX_API_KEY}}"
        - Rancher:
            icon: rancher.svg
            href: "https://rancher.local.tigovanroy.space"
            description: k8s
        - Longhorn:
            icon: longhorn.svg
            href: "https://longhorn.local.tigovanroy.space"
            description: k8s storage
        - Truenas:
            icon: truenas.svg
            href: "http://192.168.10.110"
            description: nfs storage
            widget:
              type: truenas
              url: http://192.168.10.110
              key: "{{HOMEPAGE_VAR_TRUENAS_APIKEY}}"
              enablePools: true
              nasType: scale
    - Calendar:
        - "Calendar":
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
              showTime: false
              timezone: Europe/Brussels
    - Apps: 
        - mealie:
            href: "https://mealie.local.tigovanroy.space"
            description: A self-hosted recipe manager and meal planner
            icon: mealie.png
            namespace: mealie
            widget:
              type: mealie
              url: "https://mealie.local.tigovanroy.space"
              key: "{{HOMEPAGE_VAR_MEALIE_API_TOKEN}}"
              version: 2
        - Vaultwarden:
            icon: bitwarden.svg
            href: "https://vaultwarden.local.tigovanroy.space"
            description: Self-hosted Bitwarden Admin Interface
        - Immich:
            icon: immich.png
            href: "https://immich.local.tigovanroy.space"
            description: Self-hosted Picture and video solution
            widget:
              type: immich
              url: https://immich.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_IMMICH_APIKEY}}"
              version: 2 # optional, default is 1
        - Jellyseerr:
            icon: jellyseerr.png
            href: "https://jellyseerr.local.tigovanroy.space"
            description: Movies and series requester
            widget:
              type: jellyseerr
              url: https://jellyseerr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_JELLYSEERR_APIKEY}}"
        - Jellyfin:
            icon: jellyfin.png
            href: "https://jellyfin.local.tigovanroy.space"
            description: Movies and series requester
            widget:
              type: jellyfin
              url: https://jellyfin.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_JELLYFIN_APIKEY}}"
              enableBlocks: true
              enableNowPlaying: false
              enableUser: true
              showEpisodeNumber: true 
              expandOneStreamToTwoRows: false
        - Homeassistant:
            icon: home-assistant.png
            href: "https://homeassistant.local.tigovanroy.space"
            description: Home automation
            widget:
              type: homeassistant
              url: https://homeassistant.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_HOMEASSISTANT_APIKEY}}"
              custom:
                - template: "{{ states.switch|selectattr('state','equalto','on')|list|length }}"
                  label: switches on
                - state: weather.forecast_home
                  label: wind speed
                  value: "{attributes.wind_speed} {attributes.wind_speed_unit}"
    - Downloading:
        - Qbittorrent:
            icon: qbittorrent.png
            href: "https://qbittorrent.local.tigovanroy.space"
            description: Downloading Linux ISOs
            namespace: media              
            widget:
              type: qbittorrent
              url: https://qbittorrent.local.tigovanroy.space
              username: admin
              password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
        - Radarr:
            icon: radarr.png
            href: "https://radarr.local.tigovanroy.space"
            description: indexing Linux ISOs
            namespace: media      
            widget:
              type: radarr
              url: https://radarr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_RADARR_APIKEY}}"
              enableQueue: true # optional, defaults to false
        - Sonarr:
            icon: sonarr.png
            href: "https://sonarr.local.tigovanroy.space"
            description: indexing Linux ISOs
            namespace: media      
            widget:
              type: sonarr
              url: https://sonarr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_SONARR_APIKEY}}"
              enableQueue: true # optional, defaults to false
        - Lidarr:
            icon: lidarr.png
            href: "https://lidarr.local.tigovanroy.space"
            description: indexing Linux ISOs
            namespace: media      
            widget:
              type: lidarr
              url: https://lidarr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_LIDARR_APIKEY}}"
        - Bazarr:
            icon: bazarr.png
            href: "https://bazarr.local.tigovanroy.space"
            description: grabbing Linux ISO subtitles
            namespace: media      
            widget:
              type: bazarr
              url: https://bazarr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_BAZARR_APIKEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: "https://prowlarr.local.tigovanroy.space"
            description: grabbing Linux ISOs
            namespace: media      
            widget:
              type: prowlarr
              url: https://prowlarr.local.tigovanroy.space
              key: "{{HOMEPAGE_VAR_PROWLARR_APIKEY}}"
    - Networking:
        - Traefik:
            icon: traefik.png
            href: "https://traefik.local.tigovanroy.space"
            description: Reverse proxy
            namespace: traefik
            widget:
              type: traefik
              url: https://traefik.local.tigovanroy.space
              username: tigotech
              password: 9647135280Tigo
        - Adguard:
            icon: adguard-home.png
            href: "https://adguard.local.tigovanroy.space"
            description: Adblocking and dns
            namespace: adguard
            widget:
              type: adguard
              url: https://adguard.local.tigovanroy.space
              username: tigo.van.roy@hotmail.com
              password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
    - Links:
        - GitHub:
            icon: github.svg
            href: "https://github.com"
            description: source code

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "K3S Cluster"
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
        
    - openweathermap:
        label: Perk
        latitude: "{{HOMEPAGE_VAR_WEATHER_LAT}}"
        longitude: "{{HOMEPAGE_VAR_WEATHER_LONG}}"
        units: metric
        provider: openweathermap
        apiKey: "{{HOMEPAGE_VAR_OPENWEATHERMAP_API}}"
        cache: 5 
        format:
          maximumFractionDigits: 1

    - datetime:
        text_size: xl
        format:
          timeStyle: short
  docker.yaml: ""

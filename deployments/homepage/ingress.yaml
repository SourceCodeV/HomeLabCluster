---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations: 
    kubernetes.io/ingress.class: traefik-external 
    gethomepage.dev/description: Dynamically Detected Homepage
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: homepage.png
    gethomepage.dev/name: Homepage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.home.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
    - match: Host(`home.local.tigovanroy.space`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        - name: default-headers
  tls:
    secretName: local-tigovanroy-space-production-tls

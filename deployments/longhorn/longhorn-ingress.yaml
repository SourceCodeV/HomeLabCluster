kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: 
    - websecure
  routes:
  - match: Host(`www.longhorn.local.tigovanroy.space`)
    kind: Rule
    services:
      - name: longhorn-frontend
        port: 8000
  - match: Host(`longhorn.local.tigovanroy.space`)
    kind: Rule
    services:
      - name: longhorn-frontend
        port: 8000
    middlewares:
      - name: default-headers
  tls:
    secretName: local-tigovanroy-space-production-tls

